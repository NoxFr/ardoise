[package]
name = "ardoise"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NoxFr/ardoise"

[dependencies]
eframe = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }

[profile.release]
strip = true
lto = true

[dev-dependencies]
egui_kittest = "0.36"
proptest = "1.11.0"
rstest = "0.27.0"
tempfile = "3.27.0"
