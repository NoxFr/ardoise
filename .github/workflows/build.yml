name: Build binaries

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
            archive: zip
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x86_64
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
            archive: tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (tar.gz, Linux avec lanceur)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          cp "$GITHUB_WORKSPACE"/assets/icon.png "$GITHUB_WORKSPACE"/assets/ardoise.desktop "$GITHUB_WORKSPACE"/packaging/install.sh .
          tar czf ardoise-${{ matrix.name }}.tar.gz ardoise icon.png ardoise.desktop install.sh
          mv ardoise-${{ matrix.name }}.tar.gz "$GITHUB_WORKSPACE"

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz' && matrix.target != 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ardoise-${{ matrix.name }}.tar.gz ardoise
          mv ardoise-${{ matrix.name }}.tar.gz "$GITHUB_WORKSPACE"

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          7z a ardoise-${{ matrix.name }}.zip ardoise.exe
          mv ardoise-${{ matrix.name }}.zip "$GITHUB_WORKSPACE"

      - uses: actions/upload-artifact@v4
        with:
          name: ardoise-${{ matrix.name }}
          path: ardoise-${{ matrix.name }}.${{ matrix.archive }}
